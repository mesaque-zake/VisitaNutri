<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a6b3a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    
    <title>Visitas Nutricionais — SESC Mesa Brasil</title>
    
    <!-- Tabler Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
    
    <!-- Fontes do Google (Marck Script e Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              mb: { green: '#1a6b3a', 'green-light': '#e8f5ee', 'green-mid': '#2d8a50', orange: '#e8600a', 'orange-light': '#fef0e6' }
            }
          }
        }
      }
    </script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Biblioteca de geração de Planilhas (Excel) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <link rel="stylesheet" href="style.css" />

    <!-- Vinculação de manifesto PWA e ícones de instalação móvel -->
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <!-- Aplicando a Plus Jakarta Sans no sistema todo -->
  <body class="bg-gray-50 text-gray-800 h-screen overflow-hidden" style="font-family: 'Plus Jakarta Sans', sans-serif;">
    <div id="root" class="h-full w-full"></div>
    <script type="text/babel" src="app.jsx"></script>

    <!-- Script de registro do Service Worker para suporte PWA/Offline -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker registrado com sucesso!', reg.scope))
            .catch(err => console.warn('Falha ao registrar o Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
